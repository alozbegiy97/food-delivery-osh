# Development mode: hot reload, source code bind-mounted, ports on localhost.
# Usage: docker compose -f compose.yaml -f compose.dev.yaml up --build

x-test-database-url: &test-database-url "postgresql+psycopg://${TEST_POSTGRES_USER:?set TEST_POSTGRES_USER in .env}:${TEST_POSTGRES_PASSWORD:?set TEST_POSTGRES_PASSWORD in .env}@db-test:5432/${TEST_POSTGRES_DB:?set TEST_POSTGRES_DB in .env}"

services:
  db:
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"

  # Isolated database for pytest (DEC-69). Data lives in tmpfs: it is
  # discarded when the container stops, so tests never need `down -v`.
  db-test:
    image: postgis/postgis:16-3.6
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:?set TEST_POSTGRES_DB in .env}
      POSTGRES_USER: ${TEST_POSTGRES_USER:?set TEST_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?set TEST_POSTGRES_PASSWORD in .env}
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./infra/postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${TEST_DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: food-delivery-backend:dev
    build:
      target: dev
    environment:
      APP_ENV: dev
      TEST_DATABASE_URL: *test-database-url
      # Browser origin of the Vite dev server (DEC-140).
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:${FRONTEND_HOST_PORT:-5173},http://127.0.0.1:${FRONTEND_HOST_PORT:-5173}}
      # Password reset links point to the Vite dev server (DEC-108).
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:${FRONTEND_HOST_PORT:-5173}}
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      db-test:
        condition: service_healthy

  worker:
    image: food-delivery-worker:dev
    build:
      target: dev
    environment:
      APP_ENV: dev
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      # File events from Windows/Docker Desktop are unreliable: poll (DEC A6).
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      # Keep the container's Linux node_modules (do not use the host's).
      - /app/node_modules
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_started
